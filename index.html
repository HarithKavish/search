<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="A lightweight search page for harithkavish.com">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f4f9fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="https://search.harithkavish.com/">
    <link rel="icon" href="https://harithkavish.com/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://harithkavish.com/style.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('harithkavish-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title>Search</title>
</head>
<body data-page="search">
    <div class="site-shell">
        <header class="site-header">
            <div class="site-header__inner">
                <a class="brand" href="https://harithkavish.com/index.html">
                    <img class="brand__mark" src="https://harithkavish.com/logo.png" alt="" aria-hidden="true">
                    <span class="brand__text">
                        <span class="brand__name">Harith Kavish</span>
                        <span class="brand__descriptor">Independent software business</span>
                    </span>
                </a>
                <div class="site-header__actions">
                    <nav class="site-nav" id="primary-nav" aria-label="Primary">
                        <a class="site-nav__link" href="https://harithkavish.com/products.html">Products</a>
                        <a class="site-nav__link" href="https://harithkavish.com/updates.html">Updates</a>
                        <a class="site-nav__link" href="https://harithkavish.com/about-us.html">About Us</a>
                        <a class="site-nav__link" href="https://harithkavish.com/about-me.html">About Me</a>
                        <a class="site-nav__link" href="https://harithkavish.com/contact.html">Contact</a>
                        <a class="site-nav__link" href="https://harithkavish.com/sign-in.html">Sign In</a>
                    </nav>
                    <button type="button" class="theme-toggle" data-theme-toggle="true" aria-label="Switch to dark mode">Dark mode</button>
                    <div class="settings">
                        <button type="button" class="settings-toggle button" id="settings-toggle" aria-expanded="false" aria-controls="settings-menu" aria-label="Open settings">
                            <span aria-hidden="true">&#9881;</span>
                        </button>
                        <div class="settings-menu" id="settings-menu" hidden>
                            <button type="button" class="settings-item" id="background-button">Background</button>
                            <label class="settings-row" for="history-toggle">
                                <span>History</span>
                                <input id="history-toggle" type="checkbox" role="switch">
                            </label>
                            <input id="background-file" type="file" accept="image/*" hidden>
                        </div>
                    </div>
                    <button type="button" class="nav-toggle" data-nav-toggle="true" aria-controls="primary-nav" aria-expanded="false" aria-label="Open menu">
                        <span class="nav-toggle__bars" aria-hidden="true">
                            <span class="nav-toggle__bar"></span>
                            <span class="nav-toggle__bar"></span>
                            <span class="nav-toggle__bar"></span>
                        </span>
                    </button>
                </div>
            </div>
        </header>
        <main class="site-main">
            <form class="search" id="search-form" role="search">
                <label class="sr-only" for="q">Search the web</label>
                <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" autofocus placeholder="Search">
                <button type="submit" class="button button--primary">Search</button>
            </form>
            <div class="mode-tabs" role="tablist" aria-label="Search type">
                <button type="button" class="mode-tab is-active" data-mode="web" role="tab" aria-selected="true">Web</button>
                <button type="button" class="mode-tab" data-mode="images" role="tab" aria-selected="false">Images</button>
            </div>
            <div class="history-panel" id="history-panel" hidden></div>

            <section class="results" id="results" aria-live="polite"></section>
            <div class="more-row">
                <button type="button" id="load-more" class="more button" hidden>Load more</button>
            </div>
        </main>
        <footer class="site-footer">
            <div class="site-footer__inner">
                <p class="site-footer__copy">&copy; <span id="footer-year">2026</span> Harith Kavish</p>
                <nav class="site-footer__nav" aria-label="Footer">
                    <a class="site-nav__link" href="https://harithkavish.com/products.html">Products</a>
                    <a class="site-nav__link" href="https://harithkavish.com/updates.html">Updates</a>
                    <a class="site-nav__link" href="https://harithkavish.com/about-us.html">About Us</a>
                    <a class="site-nav__link" href="https://harithkavish.com/about-me.html">About Me</a>
                    <a class="site-nav__link" href="https://harithkavish.com/contact.html">Contact</a>
                    <a class="site-nav__link" href="https://harithkavish.com/legal.html">Legal</a>
                    <a class="site-nav__link" href="https://harithkavish.com/status.html">Status</a>
                    <a class="site-nav__link" href="https://harithkavish.com/sign-in.html">Sign In</a>
                </nav>
            </div>
        </footer>
    </div>
    <div class="image-viewer" id="image-viewer" hidden>
        <div class="image-viewer-panel" role="dialog" aria-modal="true" aria-label="Image preview">
            <button type="button" class="image-viewer-close" id="image-viewer-close" aria-label="Close image preview">&times;</button>
            <img id="image-viewer-img" alt="">
            <div class="image-viewer-details">
                <a id="image-viewer-url" href="#" rel="noopener noreferrer"></a>
                <p id="image-viewer-title"></p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
