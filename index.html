<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="A lightweight search page for harithkavish.com">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f4f9fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="https://search.harithkavish.com/">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- The shared design system, then only what search adds on top. -->
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/tokens.css?v=20260911.2">
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/base.css?v=20260911.2">
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/components.css?v=20260911.2">
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/utils.css?v=20260911.2">
    <link rel="stylesheet" href="styles.css">
    <script src="https://harithkavish.com/design-system/v1.0.0/harith-store.js?v=20260911.2"></script>
    <script src="https://harithkavish.com/design-system/v1.0.0/theme-toggle.js?v=20260911.2"></script>
    <script src="https://harithkavish.com/design-system/v1.0.0/harith-shell.js?v=20260911.2"></script>
    <!-- Per-surface analytics: fill in this site's own GA4/Cloudflare Web Analytics IDs once created. -->
    <meta name="harith-ga-id" content="">
    <meta name="harith-cf-token" content="">
    <script src="https://harithkavish.com/design-system/v1.0.0/analytics.js?v=20260913"></script>
    <title>Search</title>
</head>
<body data-page="search">
    <div class="site-shell">
        <harith-header
            site-title="Harith Kavish"
            site-tagline="Independent software business"
            brand-href="https://harithkavish.com/index.html"
            brand-mark="https://harithkavish.com/logo.png"
            site-settings-label="Search">
            <!-- Rendered into the shared profile dropdown, signed in or not
                 -- see design-system's docs/shell-contract.md. -->
            <template class="site-settings-items">
                <button type="button" class="user-dropdown-action" id="background-button">Background</button>
                <label class="user-dropdown-row" for="history-toggle">
                    <span>History</span>
                    <input id="history-toggle" type="checkbox" role="switch">
                </label>
                <input id="background-file" type="file" accept="image/*" hidden>
            </template>
        </harith-header>
        <main class="site-main">
            <form class="search" id="search-form" role="search">
                <label class="sr-only" for="q">Search the web</label>
                <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" autofocus placeholder="Search">
                <button type="submit" class="button button--primary">Search</button>
            </form>
            <div class="mode-tabs" role="tablist" aria-label="Search type">
                <button type="button" class="mode-tab is-active" data-mode="web" role="tab" aria-selected="true">Web</button>
                <button type="button" class="mode-tab" data-mode="images" role="tab" aria-selected="false">Images</button>
            </div>
            <div class="history-panel" id="history-panel" hidden></div>

            <section class="results" id="results" aria-live="polite"></section>
            <div class="more-row">
                <button type="button" id="load-more" class="more button" hidden>Load more</button>
            </div>
        </main>
        <harith-footer
            copyright-text="Harith Kavish"
            links='[{"label":"Home","href":"https://harithkavish.com/"},{"label":"Status","href":"https://harithkavish.com/status.html"},{"label":"Legal","href":"https://harithkavish.com/legal.html"}]'></harith-footer>
    </div>
    <div class="image-viewer" id="image-viewer" hidden>
        <div class="image-viewer-panel" role="dialog" aria-modal="true" aria-label="Image preview">
            <button type="button" class="image-viewer-close" id="image-viewer-close" aria-label="Close image preview">&times;</button>
            <img id="image-viewer-img" alt="">
            <div class="image-viewer-details">
                <a id="image-viewer-url" href="#" rel="noopener noreferrer"></a>
                <p id="image-viewer-title"></p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
