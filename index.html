<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search</title>
    <meta name="description" content="A lightweight search page for harithkavish.com">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <button type="button" class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings-menu" aria-label="Open settings">
      <span aria-hidden="true">⚙</span>
    </button>
    <div class="settings-menu" id="settings-menu" hidden>
      <button type="button" id="background-button">Background</button>
      <label class="settings-row" for="history-toggle">
        <span>History</span>
        <input id="history-toggle" type="checkbox" role="switch">
      </label>
      <input id="background-file" type="file" accept="image/*" hidden>
    </div>
    <main class="shell">
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="q">Search the web</label>
        <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" autofocus placeholder="Search">
        <button type="submit">Search</button>
      </form>
      <div class="history-panel" id="history-panel" hidden></div>

      <section class="results" id="results" aria-live="polite"></section>
      <div class="more-row">
        <button type="button" id="load-more" class="more" hidden>Load more</button>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
